name: D099 method contracts
on:
  push:
    paths:
      - "solution-architect-agent/**"
      - ".github/workflows/d099-method-contracts.yml"
  pull_request:
    paths:
      - "solution-architect-agent/**"
      - ".github/workflows/d099-method-contracts.yml"
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'jsonschema==4.23.0'
      - run: python -m unittest discover -s solution-architect-agent/tests -v
